<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detect in a photo</title>
<link rel="stylesheet" href="style.css?v=6">
<link rel="stylesheet" href="detect.css?v=6">
</head>
<body class="page">
<header class="bar">
  <div>
    <h1>Detect in a photo</h1>
    <p id="summary">Submit a photo and the trained detector marks every product it recognises.</p>
  </div>
  <nav class="modes" aria-label="Pages">
    <a href="index.html">3D twin</a>
    <a href="detect.html" class="active">Photo detector</a>
  </nav>
</header>

<main>
  <section id="drop" tabindex="0" role="button" aria-label="Choose a photo">
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/bmp" hidden>
    <p class="big">Drop a photo here, or click to choose one</p>
    <p class="hint">JPG, PNG or WebP, up to 25 MB. You can also paste an image. The photo is analysed on this computer and is not saved.</p>
    <p class="hint" id="trained"></p>
  </section>

  <section id="result" hidden>
    <div class="stage">
      <div id="frame">
        <img id="photo" alt="The submitted photo">
        <div id="boxes"></div>
      </div>
    </div>
    <div class="side">
      <h2 id="headline"></h2>
      <p class="hint" id="meta"></p>
      <label class="slider">
        <span>Minimum confidence <b id="conf-value">50%</b></span>
        <input id="conf" type="range" min="10" max="95" step="5" value="50">
      </label>
      <button id="weaker" class="secondary" hidden></button>
      <ol id="found"></ol>
      <button id="again" class="primary">Try another photo</button>
    </div>
  </section>

  <p id="status" role="status" hidden></p>
</main>

<script type="module" src="detect.js?v=6"></script>
</body>
</html>
